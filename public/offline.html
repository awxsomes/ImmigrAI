<!doctype html>
<!--
  Shown by public/sw.js when a page is opened with no connection and no copy of it is kept on
  this device yet. It stands alone (no build files), and picks its language from the address.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="robots" content="noindex" />
    <title>ImmigrAI</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem max(1.5rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        background: #eaf1ff;
        color: #111827;
        font: 17px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        width: 100%;
        max-width: 26rem;
        text-align: center;
      }
      svg {
        width: 4.5rem;
        height: 4.5rem;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.6rem;
        line-height: 1.2;
      }
      p {
        margin: 0 0 1.5rem;
        color: #4b5563;
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 3rem;
        margin-top: 0.75rem;
        border: 1px solid #1d4ed8;
        border-radius: 0.5rem;
        font-weight: 600;
        text-decoration: none;
        transition: scale 180ms;
      }
      a:active {
        scale: 0.96;
      }
      .primary {
        background: #1d4ed8;
        color: #fff;
      }
      .secondary {
        background: #fff;
        color: #111827;
        border-color: #858b94;
      }
      a:focus-visible {
        outline: 3px solid #111827;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect x="6" y="11" width="20" height="18" rx="1.5" fill="#ffffff" stroke="#111827" stroke-width="2" />
        <rect x="13" y="18" width="6" height="11" fill="#111827" />
        <path d="M3 4h26l2 8a3.2 3.2 0 0 1-5.6 1.6A3.8 3.8 0 0 1 22 15a3.8 3.8 0 0 1-3-1.4 3.8 3.8 0 0 1-3 1.4 3.8 3.8 0 0 1-3-1.4A3.8 3.8 0 0 1 10 15a3.8 3.8 0 0 1-3.4-1.4A3.2 3.2 0 0 1 1 12z" fill="#1d4ed8" stroke="#111827" stroke-width="2" stroke-linejoin="round" />
        <path d="M11.5 4 10 14.5M20.5 4 22 14.5" stroke="#f59e0b" stroke-width="3" />
      </svg>
      <h1 id="title">You are offline</h1>
      <p id="body">This page is not saved on this device yet. Pages you opened before still work.</p>
      <a id="retry" class="primary" href="">Try again</a>
      <a id="mine" class="secondary" href="/en/my-tools">My tools</a>
      <a id="home" class="secondary" href="/en">Home</a>
    </main>
    <script>
      (function () {
        var words = {
          en: ["You are offline", "This page is not saved on this device yet. Pages you opened before still work.", "Try again", "My tools", "Home"],
          es: ["Estás sin conexión", "Esta página todavía no está guardada en este dispositivo. Las páginas que ya abriste siguen funcionando.", "Intentar de nuevo", "Mis herramientas", "Inicio"],
          zh: ["您目前没有网络连接", "此页面还没有保存在这台设备上。您之前打开过的页面仍然可以使用。", "重试", "我的工具", "首页"],
          vi: ["Bạn đang mất kết nối mạng", "Trang này chưa được lưu trên thiết bị này. Các trang bạn đã mở trước đây vẫn dùng được.", "Thử lại", "Công cụ của tôi", "Trang chủ"],
        };
        var lang = location.pathname.split("/")[1];
        if (!words[lang]) lang = "en";
        var w = words[lang];
        document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
        document.getElementById("title").textContent = w[0];
        document.getElementById("body").textContent = w[1];
        document.getElementById("retry").textContent = w[2];
        var mine = document.getElementById("mine");
        mine.textContent = w[3];
        mine.href = "/" + lang + "/my-tools";
        var home = document.getElementById("home");
        home.textContent = w[4];
        home.href = "/" + lang;
        // Back online: load the page that was asked for.
        window.addEventListener("online", function () {
          location.reload();
        });
      })();
    </script>
  </body>
</html>
